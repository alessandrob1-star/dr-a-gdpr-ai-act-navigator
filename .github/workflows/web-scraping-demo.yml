name: Web Scraping Demo CI

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  workflow_dispatch:

jobs:
  code-quality:
    name: Lint, format, and type check
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Install code-quality tools
        # Pinned so a new ruff/mypy release cannot silently change the gate.
        run: python -m pip install ruff==0.15.21 mypy==2.2.0

      - name: Check formatting (ruff format)
        run: ruff format --check .

      - name: Lint (ruff check)
        run: ruff check .

      - name: Check dashboard JavaScript syntax
        run: find module_company_profile/dashboard/assets/js -name '*.js' -print0 | xargs -0 -n1 node --check

      - name: Type check (mypy)
        # Covers the packaged runtime agents, deterministic engine, demo
        # scripts, dashboard server, and every test suite. Third-party imports
        # (reportlab, python-docx) are treated as untyped, so this job does not
        # need the app dependencies.
        run: |
          mypy \
            policy_agent \
            module_web_scraping \
            module_agents \
            module_company_profile/memory_agent/company_memory_agent.py \
            module_company_profile/memory_agent/run_demo_profiles.py \
            module_company_profile/dashboard/dashboard_server.py \
            module_company_profile/dashboard/action_store.py \
            module_company_profile/dashboard/profile_store.py \
            module_company_profile/dashboard/report_exporter.py \
            module_company_profile/dashboard/report_localizer.py \
            module_company_profile/tests

  python-checks:
    name: Python checks and demo report
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.12"

      - name: Compile Python modules
        run: python -m compileall module_web_scraping module_agents module_company_profile policy_agent

      - name: Install integrated application and test dependencies
        # pytest pinned for reproducibility, matching the pinned-tools pattern
        # used by the code-quality job.
        run: |
          python -m pip install -r module_company_profile/requirements.txt
          python -m pip install pytest==8.4.2

      - name: Run complete unit test suite
        # pytest auto-discovers every test_*.py under the configured testpaths
        # (see [tool.pytest.ini_options] in pyproject.toml), so new test files
        # are picked up automatically instead of being listed by hand here.
        # It runs the existing unittest.TestCase suites unchanged.
        run: python -m pytest

      - name: Generate Dr A guardrail evaluation report
        # Deterministic guardrail eval (no LLM). The hard gate is enforced by
        # policy_agent/tests/test_guardrail_eval.py above; this step publishes
        # the human-readable report as a build artifact.
        run: |
          mkdir -p storage
          python -m policy_agent.eval \
            --json-output storage/guardrail_eval.json \
            --markdown-output storage/guardrail_eval.md

      - name: Generate demo report
        run: |
          mkdir -p storage
          python -m module_web_scraping.cli demo-report \
            --output storage/demo_report.md \
            --json-output storage/demo_report.json

      - name: Generate web scraping outputs
        run: |
          python -m module_web_scraping.cli demo-outputs \
            --output-dir storage/web_scraping_outputs

      - name: Generate agent trace
        run: |
          python -m module_agents.demo_trace \
            --output storage/agent_trace.md \
            --json-output storage/agent_trace.json

      - name: Upload demo report artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-scraping-demo-report
          path: |
            storage/demo_report.md
            storage/demo_report.json
            storage/agent_trace.md
            storage/agent_trace.json
            storage/guardrail_eval.md
            storage/guardrail_eval.json
            storage/web_scraping_outputs/

  docker-smoke:
    name: Docker smoke services
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Validate integrated application compose file
        run: docker compose -f module_company_profile/docker-compose.yml config --quiet

      - name: Build integrated dashboard image
        run: docker build -t ai-act-compliance-navigator:ci -f module_company_profile/Dockerfile .

      - name: Verify dashboard imports inside the image
        run: >-
          docker run --rm --entrypoint python ai-act-compliance-navigator:ci
          -c "import sys; sys.path.insert(0, '/app/module_company_profile/dashboard'); import dashboard_server; print('dashboard import ok')"

      - name: Build package containers
        run: docker compose -f module_web_scraping/packages/docker-compose.yml build

      - name: Run source monitoring smoke
        run: docker compose -f module_web_scraping/packages/docker-compose.yml run --rm source-monitoring

      - name: Run EUR-Lex connector smoke
        run: docker compose -f module_web_scraping/packages/docker-compose.yml run --rm eurlex-connector

      - name: Run validation engine smoke
        run: docker compose -f module_web_scraping/packages/docker-compose.yml run --rm validation-engine

      - name: Run scoring engine smoke
        run: docker compose -f module_web_scraping/packages/docker-compose.yml run --rm scoring-engine

      - name: Run regulatory data storage smoke
        run: docker compose -f module_web_scraping/packages/docker-compose.yml run --rm regulatory-data-storage
